<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alvora</title>
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Alvora">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>:root{color-scheme:dark;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}html{background:#000}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* Layout : coque d'app mobile — en-tête verre collant (jour + statut), colonne unique qui passe
   en grille 12 colonnes ≥ 900 px, barre d'onglets flottante. La teinte d'accent = statut du jour
   (Salle chaud / Repos froid). Thème unique sombre OLED, par choix. */
@property --acc { syntax: '<color>'; inherits: true; initial-value: #d95926; }
@property --acc-hi { syntax: '<color>'; inherits: true; initial-value: #ff8a57; }
@property --acc-glow { syntax: '<color>'; inherits: true; initial-value: rgba(255, 120, 60, .2); }
:root {
  color-scheme: dark;
  --bg: #000; --surface: #0c0c0e; --sheet: #111114;
  --glass: rgba(255, 255, 255, .045); --glass-hi: rgba(255, 255, 255, .085);
  --line: rgba(255, 255, 255, .09); --line-hi: rgba(255, 255, 255, .2);
  --ink: #f2f1ee; --ink-2: #b9b8b1; --ink-3: #85847e;
  --grid: #1f1f22; --axis: #37373b;
  --acc: #d95926; --acc-hi: #ff8a57; --acc-ink: #160802; --acc-glow: rgba(255, 120, 60, .2);
  --p: #9085e9; --g: #199e70; --l: #c98500;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --f-ui: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --r: 22px; --r-sm: 14px; --r-xs: 10px;
}
body[data-statut="repos"] { --acc: #3987e5; --acc-hi: #74b1ff; --acc-ink: #020a17; --acc-glow: rgba(70, 140, 255, .2); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  transition: --acc .5s ease, --acc-hi .5s ease, --acc-glow .5s ease;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc-hi); outline-offset: 2px; border-radius: 6px; }
.ic { flex: none; display: block; }
.num { font-family: var(--f-num); font-weight: 600; letter-spacing: .01em; }
.tab { font-variant-numeric: tabular-nums; }
.mut { color: var(--ink-3); } .sec { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- coque ---------- */
.app { position: relative; min-height: 100%; }
.app::before { content: ""; position: fixed; inset: 0 0 auto; height: 440px; pointer-events: none; z-index: 0;
  background: radial-gradient(70% 100% at 50% 0%, var(--acc-glow), transparent 72%); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(0, 0, 0, .62);
  -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-num); font-weight: 700; font-size: 21px; letter-spacing: .06em; text-transform: uppercase; }
.brand svg { color: var(--acc-hi); }
.brand small { font-family: var(--f-ui); font-weight: 500; font-size: 11px; letter-spacing: .04em; color: var(--ink-3); text-transform: none; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); letter-spacing: .03em; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.sync.ok i { background: var(--good); } .sync.pend i { background: var(--warn); } .sync.err i { background: var(--crit); }
.grow { flex: 1 1 0; min-width: 0; }
.daynav { display: inline-flex; align-items: center; gap: 2px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.daynav b { font-weight: 500; font-size: 14px; padding: 0 6px; min-width: 104px; text-align: center; white-space: nowrap; }
.daynav .now { font-size: 11px; color: var(--acc-hi); padding: 0 10px 0 4px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
main { position: relative; z-index: 1; padding-block: 18px 128px; }
.view-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.view-h h1 { font-family: var(--f-num); font-weight: 600; font-size: 30px; letter-spacing: .01em; line-height: 1.1; text-wrap: balance; }
.view-h p { color: var(--ink-3); font-size: 13px; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.grid > * { min-width: 0; }
@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
  .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: 1 / -1; }
  .r2 { grid-row: span 2; }
}

/* ---------- onglets ---------- */
.tabs { position: fixed; z-index: 25; left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 26px;
  background: rgba(20, 20, 23, .72); border: 1px solid var(--line-hi);
  -webkit-backdrop-filter: blur(26px) saturate(160%); backdrop-filter: blur(26px) saturate(160%);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .06); }
.tabs button { display: grid; justify-items: center; gap: 3px; padding: 8px 4px 7px; border-radius: 20px; color: var(--ink-3); font-size: 11px; font-weight: 500; letter-spacing: .03em; transition: color .2s, background .2s; }
.tabs button[aria-current="page"] { color: var(--acc-ink); background: var(--acc-hi); font-weight: 600; }
.tabs button:not([aria-current="page"]):hover { color: var(--ink); }

/* ---------- cartes ---------- */
.card { position: relative; background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .025)); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h h2 { font-size: 16px; font-weight: 600; letter-spacing: .005em; }
.card-h .sub { font-size: 12px; color: var(--ink-3); }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--acc-hi); box-shadow: 0 0 14px var(--acc-hi); }
.empty { display: grid; justify-items: start; gap: 10px; padding: 6px 0; color: var(--ink-2); font-size: 14px; }
.empty b { color: var(--ink); font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.sb { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- héro ---------- */
.hero { background: linear-gradient(160deg, color-mix(in oklab, var(--acc) 26%, transparent), rgba(255, 255, 255, .03) 55%), rgba(255, 255, 255, .02); border-color: color-mix(in oklab, var(--acc-hi) 30%, var(--line)); }
.hero-n { font-family: var(--f-num); font-weight: 700; font-size: clamp(64px, 17vw, 96px); line-height: .86; letter-spacing: -.01em; }
.hero-n small { font-family: var(--f-ui); font-size: 15px; font-weight: 500; color: var(--ink-2); letter-spacing: .02em; margin-left: 8px; }
.hero-s { color: var(--ink-2); font-size: 13px; }
.macs { display: flex; gap: 8px; flex-wrap: wrap; }
.mac { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 11px 6px 9px; border-radius: 999px; background: rgba(0, 0, 0, .34); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.mac i { width: 8px; height: 8px; border-radius: 3px; background: var(--c); align-self: center; }
.mac b { font-family: var(--f-num); font-size: 17px; font-weight: 600; }

/* ---------- contrôles ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 13px; background: var(--glass-hi); border: 1px solid var(--line); font-weight: 500; font-size: 14px; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { background: rgba(255, 255, 255, .13); }
.btn:active { transform: scale(.98); }
.btn.pri { background: var(--acc-hi); color: var(--acc-ink); border-color: transparent; font-weight: 600; }
.btn.pri:hover { background: color-mix(in oklab, var(--acc-hi) 86%, #fff); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 11px; }
.btn.wide { width: 100%; }
.btn.dan { color: #ff9a9a; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.ib { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; color: var(--ink-2); transition: background .15s, color .15s; }
.ib:hover { background: var(--glass-hi); color: var(--ink); }
.ib.sm { width: 32px; height: 32px; border-radius: 10px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); }
.seg button { min-height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--acc-hi); color: var(--acc-ink); font-weight: 600; }
.seg.neu button[aria-pressed="true"] { background: rgba(255, 255, 255, .16); color: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); font-size: 13px; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--acc-hi); color: var(--ink); background: color-mix(in oklab, var(--acc) 26%, transparent); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-3)); }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); letter-spacing: .02em; }
.fld-l b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.fld-b { position: relative; display: block; }
.inp { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); padding: 0 12px; font-size: 16px; color: var(--ink); min-width: 0; }
.inp::placeholder { color: var(--ink-3); opacity: .7; }
.inp:focus { outline: none; border-color: var(--acc-hi); background: rgba(255, 255, 255, .08); }
textarea.inp { height: auto; min-height: 88px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
select.inp { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 16px) 19px, calc(100% - 11px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
select.inp option { background: #16161a; color: var(--ink); }
.fld-u { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--ink-3); pointer-events: none; }
.fld-b:has(.fld-u) .inp { padding-right: 40px; }
.inp.sm { height: 36px; font-size: 15px; padding: 0 8px; text-align: center; border-radius: 10px; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form .full { grid-column: 1 / -1; }
.form.f4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.form.f3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 420px) { .form.f4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.scale button { height: 30px; border-radius: 7px; background: rgba(255, 255, 255, .06); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; transition: background .15s; }
.scale button.on { background: color-mix(in oklab, var(--acc-hi) 78%, transparent); color: var(--acc-ink); font-weight: 600; }

/* ---------- états ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: rgba(255, 255, 255, .07); color: var(--ink); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.pill.good { background: color-mix(in oklab, var(--good) 20%, transparent); } .pill.good i { background: var(--good); }
.pill.warn { background: color-mix(in oklab, var(--warn) 17%, transparent); } .pill.warn i { background: var(--warn); border-radius: 2px; }
.pill.crit { background: color-mix(in oklab, var(--crit) 26%, transparent); } .pill.crit i { background: var(--crit); border-radius: 0; transform: rotate(45deg); }
.rows { display: grid; }
.rw { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.rw:first-child { border-top: 0; padding-top: 2px; }
.rw-ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--glass-hi); color: var(--ink-2); }
.rw-l { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
.rw-v { font-family: var(--f-num); font-size: 21px; font-weight: 600; line-height: 1.15; }
.rw-t { grid-column: 2 / -1; font-size: 13px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--line); }
.tile { background: #0b0b0d; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.tile span { font-size: 12px; color: var(--ink-3); }
.tile b { font-family: var(--f-num); font-size: 26px; font-weight: 600; line-height: 1.1; }
.tile b small { font-family: var(--f-ui); font-size: 12px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.tile em { font-style: normal; font-size: 12px; color: var(--ink-2); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--glass); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.note b { color: var(--ink); font-weight: 600; }
.note.acc { border-color: color-mix(in oklab, var(--acc-hi) 40%, var(--line)); background: color-mix(in oklab, var(--acc) 14%, transparent); }
.note .ic { margin-top: 1px; color: var(--ink); }
.note > div { min-width: 0; flex: 1; display: grid; gap: 8px; }

/* ---------- jauges ---------- */
.ring { position: relative; flex: none; }
.ring svg { display: block; }
.ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-c b { font-family: var(--f-num); font-size: 38px; font-weight: 700; line-height: 1; }
.ring-c span { font-size: 12px; color: var(--ink-3); }
.mt { display: grid; gap: 5px; }
.mt-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.mt-h span { color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; }
.mt-h span i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.mt-h b { font-family: var(--f-num); font-size: 17px; font-weight: 600; }
.mt-h b small { font-family: var(--f-ui); font-weight: 400; font-size: 12px; color: var(--ink-3); }
.mt-b { position: relative; height: 8px; border-radius: 99px; background: color-mix(in oklab, var(--c) 20%, #101012); overflow: hidden; }
.mt-b i, .mt-b u { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--c); }
.mt-b u { opacity: .38; }
.vb { position: relative; height: 22px; }
.vb-t { position: absolute; left: 0; right: 0; top: 7px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.vb-t i, .vb-t u { position: absolute; inset: 0 auto 0 0; background: var(--acc-hi); border-radius: 99px; }
.vb-t u { opacity: .32; }
.vb-z { position: absolute; top: 3px; height: 16px; border-left: 2px solid var(--ink-2); border-right: 2px solid var(--ink-2); background: rgba(255, 255, 255, .05); border-radius: 3px; }

/* ---------- graphiques ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.chart text { font-family: var(--f-ui); font-size: 11px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink); font-size: 12px; font-weight: 600; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: #18181c; border: 1px solid var(--line-hi); border-radius: 10px; padding: 8px 10px; font-size: 12px; white-space: nowrap; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); display: grid; gap: 3px; }
.tip h4 { margin: 0; font-size: 11px; font-weight: 500; color: var(--ink-3); }
.tip div { display: flex; align-items: center; gap: 7px; }
.tip div i { width: 12px; height: 2px; border-radius: 2px; background: var(--c); flex: none; }
.tip div b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip div span { color: var(--ink-2); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
.legend i.box { width: 10px; height: 10px; border-radius: 3px; }
.legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
table.dt { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.dt th, .dt td { padding: 8px 12px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
.dt th { font-weight: 500; color: var(--ink-3); font-size: 12px; border-top: 0; background: rgba(255, 255, 255, .03); }
.dt th:first-child, .dt td:first-child { text-align: left; }
.mini { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.mini:first-child { border-top: 0; }
.mini span { font-size: 13px; color: var(--ink-2); }
.mini b { font-family: var(--f-num); font-size: 19px; font-weight: 600; text-align: right; }
.mini b small { font-family: var(--f-ui); font-size: 11px; font-weight: 400; color: var(--ink-3); display: block; }

/* ---------- repas ---------- */
.sum { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
.sum-r { flex: 1 1 220px; min-width: 0; display: grid; gap: 12px; }
.meal { border: 1px solid var(--line); border-radius: 18px; background: rgba(255, 255, 255, .03); overflow: hidden; }
.meal.ok { border-color: color-mix(in oklab, var(--good) 45%, var(--line)); background: color-mix(in oklab, var(--good) 7%, transparent); }
.meal-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; }
.chk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line-hi); display: grid; place-items: center; color: transparent; transition: all .15s; }
.chk[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.meal-t b { font-weight: 600; font-size: 15px; }

.plan-j { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 16px; background: rgba(0, 0, 0, .28); border: 1px solid var(--line); } .plan-j > div:first-child { display: grid; gap: 2px; } .plan-j b { font-family: var(--f-num); font-size: 20px; }

.plan-hero { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px; border-radius: 24px; border: 1px solid color-mix(in oklab, var(--acc-hi) 34%, var(--line)); background: radial-gradient(90% 130% at 100% 0%, color-mix(in oklab, var(--acc) 32%, transparent), transparent 65%), rgba(255, 255, 255, .03); }
.ph-l { display: grid; gap: 8px; min-width: 0; justify-items: start; } .ph-k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

.day2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .day-c { display: grid; gap: 6px; padding: 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--glass); align-content: start; }

.mc { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; } .mc span { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); } .mc span i { width: 7px; height: 7px; border-radius: 2px; }
.mc-b { height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; } .mc-b u { display: block; height: 100%; border-radius: 99px; } .mc b { font-family: var(--f-num); font-size: 15px; }

@media (max-width: 380px) { .ph-n { font-size: 48px; } .bn-row { grid-template-columns: 48px minmax(0, 1fr) 48px; } .bn-b { height: 48px; } }

/* ---------- plan repas : modes, programmes, semaine ---------- */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mode { display: grid; gap: 3px; justify-items: start; align-content: start; text-align: left; padding: 11px 11px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); transition: border-color .2s, background .2s, transform .15s; }
.mode:active { transform: scale(.98); }
.mode i { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: rgba(255, 255, 255, .07); color: var(--ink-2); margin-bottom: 4px; transition: background .2s, color .2s; }

.wk-d p { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }

/* ---------- compléments : progression et célébration ---------- */
.supc { overflow: hidden; }

.supc-n small { font-size: 15px; color: var(--ink-3); margin-left: 1px; }
.supc-bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.supc-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--acc), var(--acc-hi)); transition: width .45s cubic-bezier(.2, .8, .2, 1); }
.supc.done { border-color: color-mix(in oklab, var(--good) 55%, var(--line)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 0 1px color-mix(in oklab, var(--good) 25%, transparent), 0 10px 36px -12px color-mix(in oklab, var(--good) 50%, transparent); }

.pill.pop { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }

@keyframes tick { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.fx { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle at 50% 45%, color-mix(in oklab, var(--good) 22%, rgba(0, 0, 0, .78)), rgba(0, 0, 0, .72) 70%); animation: fxbg 2.3s ease both; border-radius: inherit; }

.fx-ring { width: 84px; height: 84px; grid-area: 1 / 1; transform: translateY(-14px); animation: fxring .6s cubic-bezier(.2, 1.3, .4, 1) both; }
.fx-ring circle { fill: color-mix(in oklab, var(--good) 28%, transparent); stroke: var(--good); stroke-width: 3; stroke-dasharray: 214; stroke-dashoffset: 214; animation: draw .6s .05s ease forwards; }
.fx-ring path { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .4s .45s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fxring { 0% { transform: translateY(-14px) scale(.4); } 100% { transform: translateY(-14px) scale(1); } }
.fx > i { position: absolute; left: 50%; top: calc(50% - 14px); width: 8px; height: 14px; border-radius: 2px; background: var(--c); opacity: 0; transform: rotate(var(--a)) translateY(0); animation: burst 1.5s var(--t) cubic-bezier(.15, .8, .3, 1) both; }
@keyframes burst { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: rotate(calc(var(--a) + 160deg)) translateY(calc(var(--d) * -1)) scale(1); } }
.fx-t { grid-area: 1 / 1; align-self: end; margin-bottom: 26px; font-family: var(--f-num); font-size: 20px; font-weight: 600; letter-spacing: .03em; color: #fff; animation: fxt .5s .5s ease both; }
@keyframes fxt { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Analyse : carte objectif ---------- */
.obj-hero { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }

.jr-t i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, color-mix(in oklab, var(--acc) 60%, transparent), var(--acc-hi)); transition: width .6s cubic-bezier(.2, .8, .2, 1); }

.jr-l span { display: grid; gap: 1px; }

.jr-c { text-align: center; }
.jr-l b { font-family: var(--f-num); font-size: 18px; font-weight: 600; color: var(--ink); }
.kps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 720px) { .kps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kp { position: relative; display: grid; gap: 3px; align-content: start; padding: 14px 14px 13px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .02)); overflow: hidden; }
.kp-i { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 11px; background: color-mix(in oklab, var(--acc) 22%, transparent); color: var(--acc-hi); margin-bottom: 4px; }

.kp.good .kp-i { background: color-mix(in oklab, var(--good) 22%, transparent); color: #7ee07e; }
.kp.warn .kp-i { background: color-mix(in oklab, var(--warn) 20%, transparent); color: var(--warn); }

/* ---------- Training : fatigue et cardio ---------- */
.fat-b { display: flex; gap: 12px; align-items: center; padding: 13px 14px; border-radius: 18px; border: 1px solid color-mix(in oklab, var(--good) 40%, var(--line)); background: color-mix(in oklab, var(--good) 10%, transparent); }
.fat-b > i { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; background: color-mix(in oklab, var(--good) 26%, transparent); color: #8be88b; }
.fat-b b { display: block; font-size: 15px; font-weight: 600; }
.fat-b span { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.35; }

.ggs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.gg.crit { --gc: var(--crit); }
.gg-h { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.gg-h i { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 9px; background: color-mix(in oklab, var(--gc) 24%, rgba(255, 255, 255, .05)); color: var(--gc); }
.gg-v { font-family: var(--f-num); font-size: 30px; font-weight: 600; line-height: 1.05; }
.gg-v small { font-family: var(--f-ui); font-size: 12px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.gg-b { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.gg-b i { display: block; height: 100%; border-radius: 99px; background: var(--gc); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.gg-s { font-size: 11.5px; color: var(--ink-3); }

.cardio { display: grid; gap: 12px; padding: 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--glass); }
.cardio-h { display: flex; align-items: center; gap: 11px; }
.cardio-h > i { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: color-mix(in oklab, var(--acc) 22%, transparent); color: var(--acc-hi); }
.cardio-h > div:nth-child(2) { flex: 1; min-width: 0; }
.cardio-h b { display: block; font-size: 14.5px; font-weight: 600; }
.cardio-h span { font-size: 12px; color: var(--ink-3); }
.cardio-k { font-family: var(--f-num); font-size: 22px; font-weight: 600; color: var(--ink-3); text-align: right; }

@media (max-width: 380px) { .modes { grid-template-columns: 1fr; } .mode { grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; } .mode i { grid-row: span 2; margin: 0; } .obj-n { font-size: 46px; } }

/* ---------- espace muscu : onglets, programme, séances, bibliothèque ---------- */
.ttabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px; margin-bottom: 14px; border-radius: 20px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); }

.phero { background: radial-gradient(120% 140% at 0% 0%, color-mix(in oklab, var(--acc) 26%, transparent), transparent 60%), linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02)); }

.sp-k { text-align: center; line-height: 1.05; }

.pr-n b { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pr-n > span { display: flex; gap: 6px; flex-wrap: wrap; }
.pr-a { display: flex; gap: 0; }
.pill-m { font-style: normal; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .08); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pill-m.rir { background: color-mix(in oklab, var(--acc) 22%, transparent); color: var(--acc-hi); }

.vols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

.plan-w { display: grid; gap: 6px; }
.plan-d { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 10px; padding: 6px 8px 6px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); }
.plan-d span { font-family: var(--f-num); font-size: 17px; font-weight: 600; color: var(--ink-3); letter-spacing: .03em; }
.plan-d.on { border-color: color-mix(in oklab, var(--acc-hi) 40%, var(--line)); } .plan-d.on span { color: var(--acc-hi); }
.plan-d select { min-height: 38px; }
.lib { display: grid; gap: 8px; }
.lib-g { border-radius: 16px; border: 1px solid var(--line); background: var(--glass); overflow: hidden; }
